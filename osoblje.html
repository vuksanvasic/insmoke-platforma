<!doctype html>
<html lang="sr-Latn">
<head>
<script>if(/github\.io$/.test(location.hostname)){location.replace('https://insmoke.rs/aplikacija/osoblje.html'+location.search+location.hash);}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ISWT Kuhinja">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="osoblje-manifest.json">
<link rel="apple-touch-icon" href="osoblje-apple-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="osoblje-icon-192.png">
<title>Kuhinja · In Smoke We Trust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* Kuhinja osoblje — In Smoke We Trust.
   VOICE: smokehouse posle ponoći — crno, dim, roze neon, bela slova kao na logu.
   COLOUR: crno-belo kao logo; roze #FF73AC samo kao mali akcenat (SMOKE, aktivno, oznaka 1. smene); crvena #D60010 samo za alarm/kasni.
   TYPE: Bebas Neue za naslove, Montserrat za tekst i brojeve (tabularne cifre).
   LAYOUT: mobilno prvo, krupni dodiri, kartice na tamnom dimu; desktop za Kontrolu. */
:root{
  --bg:#0b0b0b; --surface:#151515; --surface-2:#1e1e1e; --surface-3:#262626; --ink:#ffffff; --muted:#a6a6a6; --line:#262626; --line-2:#363636;
  --pink:#FF73AC; --pink-deep:#d94a88; --red:#D60010; --white:#ffffff;
  --good:#3ddc84; --good-soft:rgba(61,220,132,.12); --warn:#ffb547; --warn-soft:rgba(255,181,71,.13); --bad:#ff3b47; --bad-soft:rgba(214,0,16,.18);
  --s1:#FF73AC; --s1-deep:#c23d78; --s1-soft:rgba(255,115,172,.14);
  --s2:#f2f2f2; --s2-deep:#9a9a9a; --s2-soft:rgba(255,255,255,.10);
  --shift:var(--pink); --shift-deep:var(--pink-deep); --shift-soft:rgba(255,115,172,.14); --on-shift:#0b0b0b;
  --r:16px; --r-sm:12px;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.45);
  --f-display:"Bebas Neue","Oswald",Impact,"Arial Narrow",sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Montserrat",system-ui,sans-serif;
  color-scheme:dark;
}
body.s1{--shift:var(--s1);--shift-deep:var(--s1-deep);--shift-soft:var(--s1-soft);--on-shift:#0b0b0b}
body.s2{--shift:var(--s2);--shift-deep:var(--s2-deep);--shift-soft:var(--s2-soft);--on-shift:#0b0b0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--f-body);min-height:100vh;font-variant-numeric:tabular-nums;
  background-image:radial-gradient(900px 500px at 15% -10%,rgba(255,255,255,.07),transparent 60%),radial-gradient(700px 500px at 110% 20%,rgba(255,255,255,.04),transparent 60%),radial-gradient(800px 600px at 50% 120%,rgba(255,255,255,.05),transparent 60%);
  background-attachment:fixed;
  padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
input,select,textarea{font:500 17px var(--f-body);color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line-2);border-radius:var(--r-sm);padding:13px 14px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:#6f6f6f}
input:focus,select:focus,textarea:focus{border-color:var(--pink);outline:none}
textarea{min-height:92px;resize:vertical}
input.num{text-align:center;font-size:24px;font-weight:700}
label.f{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:700;letter-spacing:.02em;min-width:0;color:#d9d9d9}
label.f small{font-weight:500;color:var(--muted)}

/* gornja traka */
.top{position:sticky;top:0;z-index:20;background:rgba(11,11,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{font:400 26px/0.9 var(--f-display);letter-spacing:.02em;color:#fff;display:flex;flex-direction:column}
.wordmark .sm{color:var(--pink)}
.wordmark small{font:700 10px var(--f-body);letter-spacing:.28em;color:var(--muted);margin-top:4px}
.me{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px}
.me span{font-size:12px;color:var(--muted);text-align:right;line-height:1.25}
.me span b{display:block;color:#fff;font-weight:700;font-size:14px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--surface-3);color:#fff;border:1.5px solid var(--line-2);display:grid;place-items:center;font:400 20px var(--f-display);font-style:normal;letter-spacing:.03em}
.menu{position:absolute;right:12px;top:calc(66px + env(safe-area-inset-top,0px));background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 20px 40px rgba(0,0,0,.6);min-width:220px;overflow:hidden;z-index:30}
.menu a,.menu button{display:block;width:100%;text-align:left;padding:15px 16px;background:none;border:0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer}
.menu :last-child{border-bottom:0}

main{max-width:760px;margin:0 auto;padding:18px 16px;display:flex;flex-direction:column;gap:16px}
main.wide{max-width:1120px}
h1,h2,h3{margin:0}
.h-xl{font:400 44px/0.92 var(--f-display);letter-spacing:.01em}
.h-lg{font:400 34px/0.95 var(--f-display);letter-spacing:.01em}
.h-md{font:400 24px/1 var(--f-display);letter-spacing:.03em}
.eyebrow{font:700 11px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.on .eyebrow{color:inherit;opacity:.75}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:14px;border:0;font:800 15px var(--f-body);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;background:#fff;color:#0b0b0b;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.shift,.btn.pink{background:#fff;color:#0b0b0b}
.btn.good{background:var(--good);color:#04140b}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-2)}
.btn.light{background:transparent;color:#fff;border:1.5px solid var(--line-2)}
.btn.inv{background:#fff;color:#0b0b0b}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{min-height:42px;padding:0 14px;font-size:12px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--f-body);padding:6px 11px;border-radius:99px;background:var(--surface-3);color:#e6e6e6;white-space:nowrap}
.chip .ico{width:15px;height:15px}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.shift{background:var(--surface-3);color:#fff}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.empty b{display:block;color:var(--ink);font:400 24px var(--f-display);letter-spacing:.03em;margin-bottom:4px}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.lg{width:26px;height:26px}

/* izbor smene */
.hello .h-xl span{color:#fff}
.shifts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.shifts{grid-template-columns:1fr}}
.shiftcard{position:relative;border:1px solid var(--line-2);text-align:left;border-radius:20px;padding:22px;cursor:pointer;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;overflow:hidden;background:var(--surface);color:#fff;box-shadow:var(--shadow)}
.shiftcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.shiftcard.s1::before{background:var(--pink)} .shiftcard.s2::before{background:#fff}
.shiftcard .ico.lg{opacity:.7}
.shiftcard .h-lg{font-size:46px;line-height:.9}
.shiftcard .meter{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.shiftcard .meter i{display:block;height:100%;background:#fff}
.shiftcard.s1 .meter i{background:var(--pink)}
.shiftcard .go{display:inline-flex;align-items:center;gap:8px;font:800 14px var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:#fff;color:#0b0b0b;padding:13px 18px;border-radius:12px;align-self:flex-start;position:relative;z-index:1}
.shiftcard .who{font-size:12px;font-weight:700;color:var(--muted)}
.gate{display:flex;gap:8px;flex-wrap:wrap}

/* traka aktivne smene */
.live{background:var(--surface);border:1px solid var(--line-2);color:#fff;border-radius:20px;padding:20px 20px 20px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.live::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--shift)}
.live .tag{display:inline-flex;align-items:center;gap:6px;font:800 11px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--shift)}
.live .tag i{width:8px;height:8px;border-radius:50%;background:var(--shift);box-shadow:0 0 0 4px var(--shift-soft)}
.live.pause{border-color:rgba(255,181,71,.5)} .live.pause::before,.live.pause .tag i{background:var(--warn)} .live.pause .tag{color:var(--warn)}
.live .h-xl{font-size:52px}
.live .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.live .stats div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.live .stats small{display:block;font:800 10px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.live .stats b{font:800 24px var(--f-body)}
.live .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.live .acts .btn{min-height:58px}
.live .note-qr{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;color:var(--muted)}

/* napredak */
.prog{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--shift) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;flex:none}
.ring b{width:54px;height:54px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:800 15px var(--f-body)}
.sectabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.sectabs::-webkit-scrollbar{display:none}
.sectab{flex:none;border:1.5px solid var(--line-2);background:var(--surface);border-radius:14px;padding:9px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:120px;color:var(--ink)}
.sectab small{font:700 12px var(--f-body);color:var(--muted)}
.sectab b{font:400 20px/1 var(--f-display);letter-spacing:.03em}
.sectab[aria-pressed="true"]{border-color:#fff;background:var(--surface-2)}
.sectab.done small{color:var(--good)}
.sectab.bad small{color:var(--bad)}

/* sledeće */
.next{border:1px solid var(--line-2);background:var(--surface-2)}
.next .eyebrow{color:var(--pink)}
.next .title{font:700 19px/1.3 var(--f-body)}

/* stavke */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item .head{display:flex;gap:14px;align-items:center;padding:15px;cursor:pointer;width:100%;text-align:left;background:none;border:0;color:var(--ink)}
.dot{width:36px;height:36px;border-radius:50%;border:2.5px solid #4a4a4a;display:grid;place-items:center;flex:none;color:#0b0b0b}
.item.done .dot{background:var(--good);border-color:var(--good)}
.item.skip .dot{background:#5a5a5a;border-color:#5a5a5a;color:#fff}
.item.late .dot{background:var(--warn);border-color:var(--warn)}
.item.alarm{border-color:rgba(214,0,16,.55)}
.item.alarm .dot{background:var(--red);border-color:var(--red);color:#fff}
.item.over .dot{border-color:var(--red)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:700;font-size:16px;line-height:1.3}
.item.done .t b,.item.skip .t b{color:#8a8a8a;font-weight:600}
.item .t span{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.item .due{font:700 13px var(--f-body);color:var(--muted);white-space:nowrap;align-self:flex-start;margin-top:4px}
.item.over .due{color:var(--bad)}
.item .body{padding:0 15px 16px 65px;display:flex;flex-direction:column;gap:14px}
@media (max-width:520px){.item .body{padding-left:15px}}
.hint{font-size:14px;color:var(--muted)}
.temps{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.temp{border:1.5px solid var(--line-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.temp .lbl{font-weight:700;font-size:14px}
.temp .rng{font:600 11px var(--f-body);color:var(--muted)}
.temp input{border:0;background:var(--bg);padding:10px}
.temp.ok{border-color:var(--good);background:var(--good-soft)} .temp.badt{border-color:var(--red);background:var(--bad-soft)}
.cam{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cam label.btn{cursor:pointer}
.cam input{display:none}
.thumb{width:86px;height:86px;border-radius:12px;object-fit:cover;background:var(--surface-3);cursor:pointer;border:0}
.done-meta{font-size:14px;color:var(--muted)}
.done-meta b{color:var(--ink)}
.tvals{display:flex;gap:6px;flex-wrap:wrap}
.handover{background:var(--warn-soft);border:1px solid rgba(255,181,71,.25);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:15px}
.handover small{display:block;font:800 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--warn);margin-bottom:4px;white-space:normal}
.note{background:var(--surface-2);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-size:15px}
.err{color:var(--bad);font-weight:700;font-size:14px}
.sign{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}

/* trebovanje */
.reqrow{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.reqrow:last-child{border-bottom:0}
.reqrow .q{font:800 16px var(--f-body);white-space:nowrap;min-width:62px}
.reqrow .n{flex:1;min-width:0}
.reqrow .n b{display:block;font-weight:700}
.reqrow .n small{color:var(--muted);font-weight:500}
.reqrow .racts{gap:6px;width:100%;justify-content:flex-end}
@media (min-width:760px){.reqrow .racts{width:auto}}
.stepper{display:grid;grid-template-columns:54px 1fr 54px;gap:6px}
.stepper button{border:1.5px solid var(--line-2);background:var(--surface-2);color:var(--ink);border-radius:12px;font-size:26px;cursor:pointer}
.status-novo{background:var(--surface-3);color:#e6e6e6}
.status-poslato{background:rgba(255,255,255,.12);color:#fff}
.status-naruceno{background:var(--warn-soft);color:var(--warn)}
.status-stiglo{background:var(--good-soft);color:var(--good)}
.status-odbijeno{background:var(--bad-soft);color:var(--bad)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.toggle input{width:24px;height:24px;accent-color:var(--red)}

/* donja navigacija */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(11,11,11,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav .in{display:flex;gap:4px;max-width:760px;width:100%}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;font:700 11px var(--f-body);letter-spacing:.04em;color:#8a8a8a;cursor:pointer;position:relative}
.bnav button[aria-current="page"]{color:#fff}
.bnav button[aria-current="page"] .ico{stroke:var(--pink)}
.bnav .badge{position:absolute;top:3px;right:calc(50% - 24px);background:var(--red);color:#fff;font:800 11px var(--f-body);min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;font-style:normal}

/* kontrola (šef/admin) */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kpi small{display:block;font:800 10px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi b{font:800 24px var(--f-body)}
.kpi.bad b{color:var(--bad)} .kpi.good b{color:var(--good)}
.band{height:5px;border-radius:99px}
.band{height:4px;width:44px} .band.s1{background:var(--s1)} .band.s2{background:var(--s2)}
.people{display:flex;gap:6px;flex-wrap:wrap}
.tablewrap{overflow-x:auto;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font:800 10px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.seg{align-self:flex-start;display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:10px 16px;border-radius:10px;font:800 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:#0b0b0b}
.datebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.datebar input{width:auto;padding:10px 12px;font-size:15px}
.qrbox{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.qrbox svg{width:200px;height:200px;background:#fff;padding:8px;border-radius:12px}

/* obaveštenja i slike */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#0b0b0b;padding:14px 18px;border-radius:14px;font-weight:700;box-shadow:0 20px 40px rgba(0,0,0,.6);z-index:60;width:max-content;max-width:92vw;display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--red);color:#fff} .toast.good{background:var(--good);color:#04140b}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.lightbox button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--line-2);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
@media (min-width:700px){.modal-bg{align-items:center}.modal{border-radius:22px}}
.install{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:14px 16px}
.install img{width:52px;height:52px;border-radius:12px;flex:none}
.install .t{flex:1;font-size:14px;line-height:1.35;color:var(--muted)}

<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const ico = (n,cls) => `<svg class="ico${cls?' '+cls:''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const pad = n => String(n).padStart(2,'0');
  const TZ='Europe/Belgrade';
  const bgParts = d => { const p={}; new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).forEach(x=>p[x.type]=x.value); return p; };
  const bgDate = d => { const p=bgParts(d); return `${p.year}-${p.month}-${p.day}`; };
  const bgHM = d => { const p=bgParts(d); return `${p.hour}:${p.minute}`; };
  const today = () => bgDate(new Date());
  const addDays = (ds,n) => { const d=new Date(ds+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
  const fmtD = ds => ds ? ds.slice(8,10)+'.'+ds.slice(5,7)+'.' : '';
  const DAYS=['nedelja','ponedeljak','utorak','sreda','četvrtak','petak','subota'];
  const DSH=['Ned','Pon','Uto','Sre','Čet','Pet','Sub'];
  const dow = ds => new Date(ds+'T12:00:00Z').getUTCDay();
  const dur = ms => { if(ms==null||ms<0) ms=0; const m=Math.floor(ms/60000); return `${Math.floor(m/60)}:${pad(m%60)}`; };
  const hrs = ms => (Math.max(0,ms)/3600000).toLocaleString('sr-Latn',{minimumFractionDigits:1,maximumFractionDigits:1});
  const num = v => { if(v==null) return null; const s=String(v).trim().replace(',','.'); if(s==='') return null; const n=Number(s); return isFinite(n)?n:null; };
  const fnum = v => String(Math.round(Number(v)*100)/100).replace('.',',');
  const initials = n => String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('');
  const ROLE = {admin:'administrator', menadzer:'menadžer', sef:'šef smene', kuvar:'kuhinja'};
  const KIND = {frizider:'frižider', zamrzivac:'zamrzivač', holding:'holding'};
  const SHIFT = {1:{name:'1. smena',sub:'Jutro · priprema i servis',ico:'sun'},2:{name:'2. smena',sub:'Veče · špica i zatvaranje',ico:'moon'}};
  const TS = {novo:'Novo',poslato:'Poslato',naruceno:'Naručeno',stiglo:'Stiglo',odbijeno:'Odbijeno'};

  const S = {uid:null,name:'',role:'',sef:false,admin:false,site:null,people:[],items:[],points:[],wasteItems:[],
             open:null,breaks:[],date:null,shift:null,done:[],reqs:[],signs:[],onShift:[],
             view:'smena',sec:null,expand:null,drafts:{},pending:{},kDate:null,kShift:null,
             treb:{name:'',qty:1,unit:'kom',urgent:false}};
  const person = id => (S.people.find(p=>p.id===id)||{}).full_name || '—';

  // ---------- obaveštenja ----------
  let tt=null;
  function toast(msg, kind){ const t=$('toast'); t.className='toast'+(kind?' '+kind:''); t.innerHTML=(kind==='bad'?ico('alert'):kind==='good'?ico('check'):'')+`<span>${esc(msg)}</span>`; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true, kind==='bad'?6000:3000); }
  function modal(html){ $('modal').innerHTML=html; $('modal-bg').hidden=false; }
  function closeModal(){ $('modal-bg').hidden=true; $('modal').innerHTML=''; }
  $('modal-bg').addEventListener('click',e=>{ if(e.target.id==='modal-bg') closeModal(); });
  function ask(title, text, okLabel, danger){ return new Promise(res=>{
    modal(`<div class="h-md">${esc(title)}</div><div class="muted">${esc(text)}</div><div class="row"><button class="btn ${danger?'danger':'shift'}" id="ask-ok" type="button" style="flex:1">${esc(okLabel||'Da')}</button><button class="btn ghost" id="ask-no" type="button" style="flex:1">Odustani</button></div>`);
    $('ask-ok').onclick=()=>{ closeModal(); res(true); }; $('ask-no').onclick=()=>{ closeModal(); res(false); };
  }); }

  // ---------- baza ----------
  const showV = id => ['login-view','noaccess-view','config-view','app-view'].forEach(v=>$(v).hidden = v!==id);
  const appCfg = window.APP_CONFIG || {};
  if(!window.supabase || !appCfg.SUPABASE_URL){ showV('config-view'); return; }
  const sb = window.supabase.createClient(appCfg.SUPABASE_URL, appCfg.SUPABASE_ANON_KEY);
  async function q(p){ const {data,error}=await p; if(error) throw error; return data; }
  const errText = e => ((e&&e.message)||String(e)).replace(/^.*?ERROR:\s*/,'');

  // ---------- QR iz adrese i lokacija ----------
  (function(){ try{ const u=new URL(location.href); const k=u.searchParams.get('k'); if(k){ sessionStorage.setItem('osoblje-qr',JSON.stringify({k,t:Date.now()})); u.searchParams.delete('k'); history.replaceState(null,'',u.pathname+u.search+u.hash); } }catch(_){} })();
  function qrCode(){ try{ const v=JSON.parse(sessionStorage.getItem('osoblje-qr')||'null'); if(v && Date.now()-v.t < 20*60000) return v.k; }catch(_){} return null; }
  function qrUsed(){ try{ sessionStorage.removeItem('osoblje-qr'); }catch(_){} }
  function getPos(required){
    if(S.site && !S.site.geo_required && required) return Promise.resolve({lat:null,lng:null,acc:null});
    return new Promise((res,rej)=>{
      if(!navigator.geolocation){ required?rej(new Error('Ovaj telefon ne daje lokaciju.')):res({lat:null,lng:null,acc:null}); return; }
      navigator.geolocation.getCurrentPosition(
        p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
        e=>{ if(!required){ res({lat:null,lng:null,acc:null}); return; }
          rej(new Error(e.code===1?'Lokacija je blokirana. Dozvoli lokaciju za insmoke.rs (podešavanja telefona → Safari/Chrome → Lokacija) i pokušaj ponovo.':'Lokacija nije dobijena. Proveri da je lokacija uključena i pokušaj ponovo.')); },
        {enableHighAccuracy:true, timeout:required?20000:6000, maximumAge:required?0:30000});
    });
  }
  const geoArgs = g => ({p_lat:g.lat, p_lng:g.lng, p_acc:g.acc==null?null:Math.round(g.acc)});

  async function loadBase(){
    const [people, items, points, wi] = await Promise.all([
      q(sb.from('profiles').select('id,full_name,role').order('full_name')),
      q(sb.from('chk_items').select('*').order('shift').order('sort')),
      q(sb.from('chk_points').select('*').order('sort')),
      q(sb.from('waste_items').select('id,name,unit,area,active').eq('active',true).order('name'))
    ]);
    try{ const st=await q(sb.rpc('staff_site_public')); S.site=(st&&st[0])||null; }catch(_){ S.site=null; }
    S.people=people||[]; S.items=items||[]; S.wasteItems=wi||[];
    S.points=(points||[]).map(p=>({...p,t_min:p.t_min==null?null:Number(p.t_min),t_max:p.t_max==null?null:Number(p.t_max)}));
  }
  async function loadMine(){
    const open = await q(sb.from('staff_shifts').select('*').eq('user_id',S.uid).is('clock_out',null).limit(1));
    S.open=(open&&open[0])||null;
    S.breaks = S.open ? await q(sb.from('staff_breaks').select('*').eq('staff_shift_id',S.open.id).order('start_at')) : [];
    if(S.open){ S.date=S.open.work_date; S.shift=S.open.shift; } else { S.date=today(); }
    document.body.className = S.open ? 's'+S.open.shift : '';
  }
  async function loadDay(date){
    const from=addDays(date,-3);
    const [done, signs] = await Promise.all([
      q(sb.from('chk_done').select('*').gte('work_date',from).lte('work_date',date)),
      q(sb.from('chk_signoff').select('*').gte('work_date',from).lte('work_date',date))
    ]);
    S.done=done||[]; S.signs=signs||[];
    if(S.sef){ try{ S.onShift=await q(sb.from('staff_shifts').select('user_id,shift,clock_in,work_date').is('clock_out',null)); }catch(_){ S.onShift=[]; } }
  }
  async function loadReqs(){
    const from=addDays(today(),-14);
    S.reqs = await q(sb.from('chk_requests').select('*').gte('work_date',from).order('created_at',{ascending:false}).limit(500)) || [];
  }

  // ---------- slike ----------
  async function stampAndShrink(file){
    try{
      const bmp=await createImageBitmap(file); const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
      const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
      const g=c.getContext('2d'); g.drawImage(bmp,0,0,c.width,c.height);
      const p=bgParts(new Date()); const txt=`${p.day}.${p.month}.${p.year} ${p.hour}:${p.minute} · ${S.name}`;
      const fs=Math.max(16,Math.round(c.width/34)); g.font=`600 ${fs}px sans-serif`; const w=g.measureText(txt).width;
      g.fillStyle='rgba(0,0,0,.6)'; g.fillRect(0,c.height-fs*1.8,Math.min(c.width,w+fs*1.2),fs*1.8); g.fillStyle='#fff'; g.fillText(txt,fs*.6,c.height-fs*.6);
      const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.8)); if(blob) return blob;
    }catch(_){}
    return file;
  }
  async function upload(blob,key){
    const path=`${S.date}/s${S.shift}/${key}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const {error}=await sb.storage.from('osoblje').upload(path,blob,{contentType:'image/jpeg',upsert:false});
    if(error) throw new Error('Slika nije poslata: '+error.message); return path;
  }
  const urlCache={};
  async function signedUrl(path){ if(urlCache[path]&&urlCache[path].t>Date.now()-500000) return urlCache[path].u;
    const {data,error}=await sb.storage.from('osoblje').createSignedUrl(path,600); if(error) return null; urlCache[path]={u:data.signedUrl,t:Date.now()}; return data.signedUrl; }
  async function fillThumbs(root){ const imgs=[...(root||document).querySelectorAll('img[data-path]:not([src])')]; await Promise.all(imgs.map(async im=>{ const u=await signedUrl(im.dataset.path); if(u) im.src=u; })); }
  document.addEventListener('click',async e=>{ const t=e.target.closest('img.thumb'); if(!t) return; e.stopPropagation(); const u=t.dataset.path?await signedUrl(t.dataset.path):t.src; if(!u) return; $('lb-img').src=u; $('lightbox').hidden=false; });
  const closeLb=()=>{ $('lightbox').hidden=true; $('lb-img').src=''; };
  $('lb-x').onclick=closeLb; $('lightbox').addEventListener('click',e=>{ if(e.target.id==='lightbox') closeLb(); });

  // ---------- rokovi i stanje ----------
  function dueOf(it,date){ if(!it.due) return null; let [h,m]=it.due.slice(0,5).split(':').map(Number); if(it.late_close && [5,6].includes(dow(date))) h+=1; return pad(h)+':'+pad(m); }
  function minutesOn(date,d){ const ds=bgDate(d); const [h,m]=bgHM(d).split(':').map(Number); return (ds>date?24*60:0)+h*60+m; }
  const toMin = hm => { const [h,m]=hm.split(':').map(Number); return h*60+m; };
  function st(it,date,shift,done){
    done=done||S.done; const d=done.find(x=>x.item_id===it.id&&x.work_date===date&&x.shift===shift); const due=dueOf(it,date);
    if(d){ const late=due&&!d.skipped&&minutesOn(date,new Date(d.done_at))>toMin(due); return {d,due,late,cls:d.alarm?'alarm':d.skipped?'skip':late?'late':'done'}; }
    const over = !!due && (date<today() || (date===today() && minutesOn(date,new Date())>toMin(due)));
    return {d:null,due,over,cls:over?'over':''};
  }
  const itemsOf = sh => S.items.filter(i=>i.active&&i.shift===sh);
  function sections(sh){ const out=[]; itemsOf(sh).forEach(i=>{ let s=out.find(x=>x.name===i.section); if(!s){ s={name:i.section,items:[]}; out.push(s); } s.items.push(i); }); return out; }
  function summary(date,sh,done){ let total=0,ok=0,late=0,over=0,alarm=0; itemsOf(sh).forEach(i=>{ total++; const s=st(i,date,sh,done); if(s.d){ ok++; if(s.late) late++; if(s.d.alarm) alarm++; } else if(s.over) over++; }); return {total,ok,late,over,alarm,pct:total?Math.round(ok/total*100):0}; }
  function nextItem(date,sh){ const open=itemsOf(sh).filter(i=>!st(i,date,sh).d); open.sort((a,b)=>{ const da=dueOf(a,date)||'99:99', db=dueOf(b,date)||'99:99'; return da===db ? a.sort-b.sort : da.localeCompare(db); }); return open.find(i=>!i.optional)||open[0]||null; }
  function lastHandover(date,shift,done){ done=done||S.done; const key=(d,s)=>d+'|'+s, cur=key(date,shift);
    const hw=S.items.filter(i=>i.code==='handover_write').map(i=>i.id);
    return done.filter(x=>hw.includes(x.item_id)&&key(x.work_date,x.shift)<cur&&x.note).sort((a,b)=>key(b.work_date,b.shift).localeCompare(key(a.work_date,a.shift)))[0]||null; }

  // ---------- donja navigacija ----------
  function renderNav(){
    const tabs=[['smena','list','Smena'],['treb','cart','Trebovanje'],['vreme','clock','Moje vreme']];
    if(S.sef) tabs.push(['kontrola','chart','Kontrola']);
    if(S.admin) tabs.push(['podes','gear','Podešavanja']);
    const newReq = S.sef ? S.reqs.filter(r=>r.status==='poslato').length : 0;

  function itemHtml(it,date,sh,readonly,done){

    if(inboxFirst) h+=mgrHtml();
    if(cur||S.sef){
      const t=S.treb;
      h+=`<section class="card">${inboxFirst?'<div class="h-md">Dodaj stavku</div>':''}<label class="f">Artikal<input list="wi-list2" id="tr-name" value="${esc(t.name)}" placeholder="npr. pavlaka, brioš, ulje…" autocomplete="off"></label>
        <div class="grid2" style="gap:10px"><label class="f">Količina<div class="stepper"><button type="button" data-step="-1">−</button><input class="num" id="tr-qty" inputmode="decimal" value="${fnum(t.qty)}"><button type="button" data-step="1">+</button></div></label>
        <label class="f">Jedinica<select id="tr-unit">${['kom','kg','l','pak','gaj','kut'].map(u=>`<option ${u===t.unit?'selected':''}>${u}</option>`).join('')}</select></label></div>
        <label class="toggle"><input type="checkbox" id="tr-urg" ${t.urgent?'checked':''}> Hitno (treba danas)</label>
        <button class="btn shift" type="button" id="tr-add">${ico('plus')} Dodaj na spisak</button>
        ${!cur?'<div class="muted" style="font-size:13px">Nisi na smeni — stavka se dodaje u današnju 1. smenu.</div>':''}
        <datalist id="wi-list2">${S.wasteItems.map(w=>`<option value="${esc(w.name)}">`).join('')}</datalist></section>`;
      const d=cur?cur.d:today(), s=cur?cur.s:1;
      const mine=S.reqs.filter(r=>r.work_date===d&&r.shift===s&&(!inboxFirst||r.status==='novo'));
      const nova=mine.filter(r=>r.status==='novo');
      const mgr=S.site&&S.site.treb_name;
      if(!(inboxFirst&&!mine.length)) h+=`<section class="card"><div class="spread"><div class="h-md">Spisak smene</div><span class="chip shift">${s}. smena · ${fmtD(d)}</span></div>
        ${mine.length?`<div>${mine.map(r=>reqRow(r,true)).join('')}</div>`:'<div class="empty"><b>Spisak je prazan</b>Dodaj šta fali, pa pošalji menadžeru.</div>'}
        ${nova.length?`<button class="btn good block" type="button" id="tr-send">${ico('send')} Pošalji ${mgr?esc(mgr):'menadžeru kuhinje'} (${nova.length})</button>
          <div class="muted" style="font-size:13px">${S.site&&S.site.treb_phone?'Stavke se označe kao poslate i otvori se WhatsApp poruka sa spiskom.':'Stavke se označe kao poslate i vide se menadžeru u aplikaciji. (WhatsApp broj menadžera nije podešen.)'}</div>`:''}</section>`;
    } else {
      h+=`<section class="card"><div class="empty"><b>Prvo prijavi dolazak</b>Trebovanje se pravi u toku smene.</div><button class="btn ghost" type="button" data-goto="smena">Na smenu</button></section>`;
    }
    if(S.sef){ if(!inboxFirst) h+=mgrHtml(); } else {
      const old=S.reqs.filter(r=>r.created_by===S.uid&&!(cur&&r.work_date===cur.d&&r.shift===cur.s)).slice(0,15);
      if(old.length) h+=`<section class="card"><div class="h-md">Moja ranija trebovanja</div><div>${old.map(r=>reqRow(r,false)).join('')}</div></section>`;
    }
    v.innerHTML=h;
  }
  function mgrHtml(){ let h='';
      const inbox=S.reqs.filter(r=>['poslato','naruceno'].includes(r.status));
      h+=`<section class="card"><div class="spread"><div class="h-md">Za nabavku</div><span class="chip">${inbox.length} otvoreno</span></div>
        ${inbox.length?`<div>${inbox.map(r=>reqRow(r,false,true)).join('')}</div><div class="row"><button class="btn ghost sm" type="button" id="tr-copy">Kopiraj spisak</button></div>`:'<div class="empty"><b>Nema otvorenog trebovanja</b>Kad kuvar pošalje spisak, pojaviće se ovde.</div>'}</section>`;
      const closed=S.reqs.filter(r=>['stiglo','odbijeno'].includes(r.status)).slice(0,20);
      if(closed.length) h+=`<section class="card"><div class="h-md">Završeno (poslednje)</div><div>${closed.map(r=>reqRow(r,false,false)).join('')}</div></section>`;
    return h; }
  function reqRow(r,mineList,mgr){
    const canDel = r.status==='novo' && (r.created_by===S.uid||S.sef) && mineList;
    return `<div class="reqrow"><span class="q">${fnum(r.qty)} ${esc(r.unit)}</span><span class="n"><b>${esc(r.name)}${r.urgent?' <span class="chip bad" style="margin-left:4px">HITNO</span>':''}</b><small>${esc(person(r.created_by))} · ${fmtD(r.work_date)} ${r.shift}. smena${r.mgr_note?' · '+esc(r.mgr_note):''}</small></span>
      <span class="chip status-${r.status}">${TS[r.status]}</span>
      ${canDel?`<button class="btn ghost sm" type="button" data-delreq="${r.id}" aria-label="Obriši">${ico('x')}</button>`:''}
      ${mgr?`<span class="row racts">${r.status==='poslato'?`<button class="btn ghost sm" type="button" data-rs="naruceno" data-rid="${r.id}">Naručeno</button>`:''}<button class="btn good sm" type="button" data-rs="stiglo" data-rid="${r.id}">Stiglo</button><button class="btn ghost sm" type="button" data-rs="odbijeno" data-rid="${r.id}">Odbij</button></span>`:''}</div>`;
  }
  $('v-treb').addEventListener('click',async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.goto){ go(b.dataset.goto); return; }
    if(b.dataset.step){ const i=$('tr-qty'); const n=Math.max(0,(num(i.value)||0)+Number(b.dataset.step)); i.value=fnum(n); S.treb.qty=n; return; }
    if(b.id==='tr-add'){ const name=$('tr-name').value.trim(), qty=num($('tr-qty').value), unit=$('tr-unit').value, urgent=$('tr-urg').checked;
      if(!name||!qty||qty<=0){ toast('Upiši artikal i količinu.','bad'); return; }
      const wi=S.wasteItems.find(w=>w.name.toLowerCase()===name.toLowerCase());
      const d=S.open?S.open.work_date:today(), s=S.open?S.open.shift:1;
      try{ await q(sb.from('chk_requests').insert({work_date:d,shift:s,waste_item_id:wi?wi.id:null,name:wi?wi.name:name,qty,unit,urgent})); S.treb={name:'',qty:1,unit:'kom',urgent:false}; toast('Dodato na spisak.','good'); renderTreb(); }catch(err){ toast(errText(err),'bad'); } return; }
    if(b.dataset.delreq){ try{ await q(sb.from('chk_requests').delete().eq('id',b.dataset.delreq)); renderTreb(); }catch(err){ toast(errText(err),'bad'); } return; }
    if(b.id==='tr-send'){ const d=S.open?S.open.work_date:today(), s=S.open?S.open.shift:1;
      const list=S.reqs.filter(r=>r.work_date===d&&r.shift===s&&r.status==='novo');
      const text=`Trebovanje · In Smoke We Trust\n${DSH[dow(d)]} ${fmtD(d)} · ${s}. smena · ${S.name}\n\n`+list.map(r=>`• ${r.name} — ${fnum(r.qty)} ${r.unit}${r.urgent?' (HITNO)':''}`).join('\n');
      const phone=S.site&&S.site.treb_phone?String(S.site.treb_phone).replace(/[^\d]/g,''):'';
      const w = phone ? window.open('about:blank','_blank') : null;
      try{ const n=await q(sb.rpc('treb_send',{p_date:d,p_shift:s})); toast(`Poslato: ${n} stavki.`,'good');
        if(phone){ const url=`https://wa.me/${phone}?text=${encodeURIComponent(text)}`; if(w) w.location=url; else location.href=url; }
        renderTreb(); }
      catch(err){ if(w) w.close(); toast(errText(err),'bad'); } return; }
    if(b.dataset.rs){ let note=null; if(b.dataset.rs==='odbijeno'){ note=prompt('Zašto se odbija? (vidi kuvar)',''); if(note===null) return; }
      try{ await q(sb.rpc('treb_set_status',{p_ids:[b.dataset.rid],p_status:b.dataset.rs,p_note:note})); toast(TS[b.dataset.rs]+'.','good'); renderTreb(); }catch(err){ toast(errText(err),'bad'); } return; }
    if(b.id==='tr-copy'){ const agg={}; S.reqs.filter(r=>['poslato','naruceno'].includes(r.status)).forEach(r=>{ const k=r.name.toLowerCase()+'|'+r.unit; const a=agg[k]=agg[k]||{name:r.name,unit:r.unit,qty:0,urgent:false}; a.qty+=Number(r.qty); a.urgent=a.urgent||r.urgent; });
      const t=Object.values(agg).sort((a,b)=>a.name.localeCompare(b.name)).map(a=>`${a.name} — ${fnum(a.qty)} ${a.unit}${a.urgent?' (HITNO)':''}`).join('\n');
      try{ await navigator.clipboard.writeText(t); toast('Spisak je kopiran.','good'); }catch(_){ toast('Kopiranje nije uspelo.','bad'); } }
  });
  $('v-treb').addEventListener('input',e=>{ if(e.target.id==='tr-name') S.treb.name=e.target.value; if(e.target.id==='tr-qty') S.treb.qty=num(e.target.value)||0; });
  $('v-treb').addEventListener('change',e=>{ if(e.target.id==='tr-unit') S.treb.unit=e.target.value; if(e.target.id==='tr-urg') S.treb.urgent=e.target.checked;
    if(e.target.id==='tr-name'){ const wi=S.wasteItems.find(w=>w.name.toLowerCase()===e.target.value.trim().toLowerCase()); if(wi){ const u=$('tr-unit'); if(![...u.options].some(o=>o.value===wi.unit)) u.add(new Option(wi.unit,wi.unit)); u.value=wi.unit; S.treb.unit=wi.unit; } } });

  // ---------- MOJE VREME ----------
  async function renderVreme(){
    const from=addDays(today(),-30);
    let sh=[],br=[]; try{ sh=await q(sb.from('staff_shifts').select('*').eq('user_id',S.uid).gte('work_date',from).order('clock_in',{ascending:false})); br=sh.length?await q(sb.from('staff_breaks').select('*').in('staff_shift_id',sh.map(x=>x.id))):[]; }catch(e){ toast(errText(e),'bad'); }
    const now=Date.now(); const rows=sh.map(s=>{ const end=s.clock_out?new Date(s.clock_out).getTime():now, tot=end-new Date(s.clock_in).getTime(); const brk=br.filter(b=>b.staff_shift_id===s.id).reduce((a,b)=>a+((b.end_at?new Date(b.end_at).getTime():now)-new Date(b.start_at).getTime()),0); return {s,tot,brk,net:tot-brk}; });
    const wk=addDays(today(),-6); const week=rows.filter(r=>r.s.work_date>=wk).reduce((a,r)=>a+r.net,0), month=rows.reduce((a,r)=>a+r.net,0);
    $('v-vreme').innerHTML=`<section><div class="eyebrow">Moje vreme</div><div class="h-xl" style="margin-top:4px">${esc(S.name)}</div></section>
      <section class="card"><div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><small>7 dana</small><b>${hrs(week)} h</b></div><div class="kpi"><small>30 dana</small><b>${hrs(month)} h</b></div><div class="kpi"><small>Smena</small><b>${rows.length}</b></div></div></section>
      <section class="card">${rows.length?rows.map(r=>`<div class="reqrow"><span class="chip" style="${r.s.shift===1?'background:var(--s1-soft);color:var(--s1)':'background:var(--s2-soft);color:#fff'}">${r.s.shift}.</span><span class="n"><b>${DSH[dow(r.s.work_date)]} ${fmtD(r.s.work_date)}</b><small>${bgHM(new Date(r.s.clock_in))} – ${r.s.clock_out?bgHM(new Date(r.s.clock_out)):'na smeni'} · pauze ${dur(r.brk)}${r.s.edited_at?' · ispravljeno':''}</small></span><span class="q">${dur(r.net)}</span></div>`).join(''):'<div class="empty"><b>Još nema smena</b>Ovde se vidi tvoje radno vreme za poslednjih 30 dana.</div>'}</section>`;
  }

  // ---------- KONTROLA (šef / admin) ----------
  async function renderKontrola(){
    if(!S.kDate) S.kDate=today();
    const d=S.kDate; let done=[],signs=[],onShift=[];
    try{ [done,signs,onShift]=await Promise.all([ q(sb.from('chk_done').select('*').gte('work_date',addDays(d,-3)).lte('work_date',d)), q(sb.from('chk_signoff').select('*').eq('work_date',d)), q(sb.from('staff_shifts').select('*').eq('work_date',d)) ]); await loadReqs(); }catch(e){ toast(errText(e),'bad'); return; }
    S.kDone=done; S.kSigns=signs;
    const box=sh=>{ const sm=summary(d,sh,done), sign=signs.find(x=>x.shift===sh), ppl=onShift.filter(x=>x.shift===sh);
      const photos=done.filter(x=>x.work_date===d&&x.shift===sh).reduce((a,x)=>a+(x.photos||[]).length,0);
      return `<section class="card"><div class="band s${sh}"></div><div class="spread"><div><div class="eyebrow">${SHIFT[sh].sub}</div><div class="h-lg">${SHIFT[sh].name}</div></div><div class="ring" style="--p:${sm.pct};--shift:var(--s${sh})"><b>${sm.pct}%</b></div></div>
        <div class="kpis"><div class="kpi"><small>Urađeno</small><b>${sm.ok}/${sm.total}</b></div><div class="kpi ${sm.over?'bad':''}"><small>Kasni</small><b>${sm.over}</b></div><div class="kpi ${sm.alarm?'bad':''}"><small>Alarm temp.</small><b>${sm.alarm}</b></div><div class="kpi"><small>Slike</small><b>${photos}</b></div></div>
        <div class="people">${ppl.length?ppl.map(p=>`<span class="chip ${p.clock_out?'':'good'}">${esc(person(p.user_id))} · ${bgHM(new Date(p.clock_in))}${p.clock_out?'–'+bgHM(new Date(p.clock_out)):' · na smeni'}</span>`).join(''):'<span class="muted">Niko se nije prijavio.</span>'}</div>
        <div class="row">${sign?`<span class="chip good">${ico('check')} Potvrdio/la ${esc(person(sign.signed_by))}</span>`:'<span class="chip">Nije potvrđena</span>'}<button class="btn ghost sm" type="button" data-kshift="${sh}" style="margin-left:auto">Detalji i slike</button></div></section>`; };
    const openReq=S.reqs.filter(r=>r.status==='poslato').length, urgent=S.reqs.filter(r=>['poslato','naruceno'].includes(r.status)&&r.urgent).length;
    let h=`<section class="spread" style="flex-wrap:wrap"><div><div class="eyebrow">Kontrola kuhinje</div><div class="h-xl" style="margin-top:4px">${d===today()?'Danas':DSH[dow(d)]+' '+fmtD(d)}</div></div>
      <div class="datebar"><button class="btn ghost sm" type="button" data-kd="-1">‹</button><input type="date" id="k-date" value="${d}"><button class="btn ghost sm" type="button" data-kd="1" ${d>=today()?'disabled':''}>›</button></div></section>
      ${openReq||urgent?`<section class="card" style="flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap"><div class="row">${ico('cart','lg')}<div><b>${openReq} novih stavki za nabavku</b>${urgent?`<div class="err">${urgent} hitno</div>`:''}</div></div><button class="btn pink sm" type="button" data-goto="treb">Otvori trebovanje</button></section>`:''}
      <div class="grid2">${box(1)}${box(2)}</div>
      <div class="seg" role="group"><button type="button" data-kt="cl" aria-pressed="${S.kTab!=='rad'}">Ček-lista</button><button type="button" data-kt="rad" aria-pressed="${S.kTab==='rad'}">Radno vreme</button></div>
      <div id="k-sub"></div>`;
    $('v-kontrola').innerHTML=h;
    if(S.kTab==='rad') renderRad(); else renderKDetail();
  }
  function renderKDetail(){
    const d=S.kDate, sh=S.kShift||1, done=S.kDone||[];
    const secs=sections(sh); const keepSigns=S.signs; S.signs=S.kSigns||[];
    const sm=summary(d,sh,done);
    let h=`<div class="seg" role="group" style="margin-bottom:12px"><button type="button" data-ks="1" aria-pressed="${sh===1}">1. smena</button><button type="button" data-ks="2" aria-pressed="${sh===2}">2. smena</button></div>`;
    h+=secs.map(s=>`<section style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px"><div class="spread"><div class="h-md">${esc(s.name)}</div><span class="chip">${s.items.filter(i=>st(i,d,sh,done).d).length}/${s.items.length}</span></div><div class="list">${s.items.map(i=>itemHtml(i,d,sh,true,done)).join('')}</div></section>`).join('');
    h+=signHtml(d,sh,sm);
    S.signs=keepSigns;
    $('k-sub').innerHTML=h; fillThumbs($('k-sub'));
  }
  async function renderRad(){
    const d=S.kDate, from=addDays(d,-6);
    let sh=[],br=[]; try{ sh=await q(sb.from('staff_shifts').select('*').gte('work_date',from).lte('work_date',d).order('clock_in',{ascending:false})); br=sh.length?await q(sb.from('staff_breaks').select('*').in('staff_shift_id',sh.map(x=>x.id))):[]; }catch(e){ toast(errText(e),'bad'); return; }
    const now=Date.now(); const rows=sh.map(s=>{ const end=s.clock_out?new Date(s.clock_out).getTime():now, tot=end-new Date(s.clock_in).getTime(); const bs=br.filter(b=>b.staff_shift_id===s.id); const brk=bs.reduce((a,b)=>a+((b.end_at?new Date(b.end_at).getTime():now)-new Date(b.start_at).getTime()),0); return {s,tot,brk,net:tot-brk}; });
    const per={}; rows.forEach(r=>{ const p=per[r.s.user_id]=per[r.s.user_id]||{n:0,net:0,brk:0}; p.n++; p.net+=r.net; p.brk+=r.brk; });
    $('k-sub').innerHTML=`<div class="muted" style="margin-bottom:10px">Poslednjih 7 dana do ${fmtD(d)}</div>
      ${Object.keys(per).length?`<div class="tablewrap" style="margin-bottom:14px"><table><thead><tr><th>Osoba</th><th class="n">Smena</th><th class="n">Rad (h)</th><th class="n">Pauze (h)</th></tr></thead><tbody>${Object.entries(per).sort((a,b)=>person(a[0]).localeCompare(person(b[0]))).map(([u,p])=>`<tr><td>${esc(person(u))}</td><td class="n">${p.n}</td><td class="n"><b>${hrs(p.net)}</b></td><td class="n">${hrs(p.brk)}</td></tr>`).join('')}</tbody></table></div>`:''}
      ${rows.length?`<div class="tablewrap"><table><thead><tr><th>Dan</th><th>Osoba</th><th>Smena</th><th>Dolazak</th><th>Odlazak</th><th class="n">Od lokala</th><th class="n">Pauze</th><th class="n">Rad</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${DSH[dow(r.s.work_date)]} ${fmtD(r.s.work_date)}</td><td>${esc(person(r.s.user_id))}</td><td>${r.s.shift}.</td><td>${bgHM(new Date(r.s.clock_in))}</td><td>${r.s.clock_out?bgHM(new Date(r.s.clock_out)):'<b style="color:var(--good)">na smeni</b>'}</td><td class="n">${r.s.in_dist_m!=null?Math.round(r.s.in_dist_m)+' m':'—'}</td><td class="n">${dur(r.brk)}</td><td class="n"><b>${dur(r.net)}</b></td><td>${r.s.edited_at?'<span class="chip warn">ispravljeno</span> ':''}<button class="btn ghost sm" type="button" data-fix="${r.s.id}">Ispravi</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card"><div class="empty"><b>Nema evidencije</b></div></div>'}`;
    S.radRows=sh;
  }
  $('v-kontrola').addEventListener('click',async e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.goto){ go(b.dataset.goto); return; }
    if(b.dataset.kd){ S.kDate=addDays(S.kDate,Number(b.dataset.kd)); if(S.kDate>today()) S.kDate=today(); renderKontrola(); return; }
    if(b.dataset.kt){ S.kTab=b.dataset.kt; renderKontrola(); return; }
    if(b.dataset.ks||b.dataset.kshift){ S.kShift=Number(b.dataset.ks||b.dataset.kshift); S.kTab='cl'; if(b.dataset.kshift){ renderKontrola().then(()=>$('k-sub').scrollIntoView({behavior:'smooth'})); } else renderKDetail(); return; }
    if(b.dataset.sign||b.dataset.unsign){ const [d,sh]=(b.dataset.sign||b.dataset.unsign).split('|');
      if(b.dataset.unsign && !(await ask('Poništiti potvrdu?','Kuvari ponovo mogu da menjaju stavke ove smene.','Poništi',true))) return;
      try{ await q(sb.rpc('chk_sign',{p_date:d,p_shift:Number(sh),p_note:b.dataset.sign?(document.querySelector('#k-sub [data-signnote]')||{}).value||null:null,p_undo:!!b.dataset.unsign})); toast('Sačuvano.','good'); renderKontrola(); }catch(err){ toast(errText(err),'bad'); } return; }
    if(b.dataset.fix){ const s=(S.radRows||[]).find(x=>x.id===b.dataset.fix); if(!s) return;
      const fmtIn=t=>t?bgHM(new Date(t)):'';
      modal(`<div class="h-md">Ispravka radnog vremena</div><div class="muted">${esc(person(s.user_id))} · ${DSH[dow(s.work_date)]} ${fmtD(s.work_date)} · ${s.shift}. smena</div>
        <div class="grid2" style="gap:10px"><label class="f">Dolazak<input type="time" id="fx-in" value="${fmtIn(s.clock_in)}"></label><label class="f">Odlazak<small>prazno = još na smeni</small><input type="time" id="fx-out" value="${fmtIn(s.clock_out)}"></label></div>
        <label class="f">Razlog ispravke<input id="fx-note" value="${esc(s.note||'')}" placeholder="npr. zaboravio odjavu"></label>
        <div class="row"><button class="btn" type="button" id="fx-ok" style="flex:1">Sačuvaj</button><button class="btn ghost" type="button" id="fx-no" style="flex:1">Odustani</button></div>`);
      const toTs=(hm,base)=>{ if(!hm) return null; for(const off of ['+01:00','+02:00']){ const x=new Date(`${base}T${hm}:00${off}`); if(bgHM(x)===hm) return x.toISOString(); } return new Date(`${base}T${hm}:00+01:00`).toISOString(); };
      $('fx-no').onclick=closeModal;
      $('fx-ok').onclick=async()=>{ try{ const inT=toTs($('fx-in').value,s.work_date); let outT=toTs($('fx-out').value,s.work_date); if(outT&&inT&&outT<inT) outT=toTs($('fx-out').value,addDays(s.work_date,1));
        await q(sb.rpc('staff_fix',{p_id:s.id,p_in:inT,p_out:outT,p_note:$('fx-note').value})); closeModal(); toast('Ispravljeno.','good'); renderRad(); }catch(err){ toast(errText(err),'bad'); } };
      return; }
    if(b.dataset.undo){ if(!(await ask('Poništiti čekiranje?','Stavka se vraća kao neurađena.','Poništi',true))) return; try{ await q(sb.rpc('chk_uncheck',{p_id:b.dataset.undo})); renderKontrola(); }catch(err){ toast(errText(err),'bad'); } }
  });
  $('v-kontrola').addEventListener('change',e=>{ if(e.target.id==='k-date'){ S.kDate=e.target.value&&e.target.value<=today()?e.target.value:today(); renderKontrola(); } });

  // ---------- PODEŠAVANJA (admin) ----------
  let siteFull=null;
  async function renderPodes(){
    try{ const r=await q(sb.from('staff_site').select('*').eq('id',1)); siteFull=r&&r[0]; await loadBase(); }catch(e){ toast(errText(e),'bad'); }
    if(!siteFull){ $('v-podes').innerHTML='<div class="card"><b>Nije pokrenut SQL 22/23.</b></div>'; return; }
    const url=location.origin+'/aplikacija/osoblje.html?k='+siteFull.qr_secret;
    let svg=''; try{ const qr=qrcode(0,'M'); qr.addData(url); qr.make(); svg=qr.createSvgTag({cellSize:6,margin:2,scalable:true}); }catch(_){ svg='<div class="muted">QR biblioteka nije učitana.</div>'; }
    $('qr-print').innerHTML=`<div style="font:900 48px var(--f-display);text-transform:uppercase">In Smoke We Trust</div><div style="font-size:26px;font-weight:700">Skeniraj kamerom telefona<br>za DOLAZAK i ODLAZAK</div>${svg}<div style="font-size:16px">Kuhinja · insmoke.rs/osoblje</div>`;
    const staff=S.people.filter(p=>['kuvar','sef','menadzer','admin'].includes(p.role));
    $('v-podes').innerHTML=`<section><div class="eyebrow">Podešavanja</div><div class="h-xl" style="margin-top:4px">Kuhinja</div></section>
      <div class="grid2">
      <section class="card"><div class="h-md">${ico('qr')} QR kod za zid</div><div class="qrbox"><div>${svg}</div><div style="display:flex;flex-direction:column;gap:10px;flex:1;min-width:200px"><div class="muted">Odštampaj i zalepi pored ulaza u kuhinju. Ako neko pošalje sliku koda, napravi nov — stari odmah prestaje da važi.</div><button class="btn" type="button" id="qr-print-btn">Štampaj QR kod</button><button class="btn ghost" type="button" id="qr-new">Nov QR kod</button></div></div></section>
      <section class="card"><div class="h-md">${ico('pin')} Lokal</div>
        <div class="grid2" style="gap:10px"><label class="f">Geografska širina<input id="st-lat" inputmode="decimal" value="${siteFull.lat}"></label><label class="f">Geografska dužina<input id="st-lng" inputmode="decimal" value="${siteFull.lng}"></label></div>
        <div class="grid2" style="gap:10px"><label class="f">Krug (m)<input id="st-rad" inputmode="numeric" value="${siteFull.radius_m}"></label><button class="btn ghost" type="button" id="st-here" style="align-self:end">${ico('pin')} Moja lokacija</button></div>
        <label class="toggle"><input type="checkbox" id="st-geo" ${siteFull.geo_required?'checked':''} style="accent-color:var(--good)"> Provera lokacije (GPS)</label>
        <label class="toggle"><input type="checkbox" id="st-qr" ${siteFull.qr_required?'checked':''} style="accent-color:var(--good)"> QR kod za dolazak i odlazak</label>
        <button class="btn" type="button" id="st-save">Sačuvaj lokal</button></section>
      <section class="card"><div class="h-md">${ico('cart')} Menadžer kuhinje (trebovanje)</div><div class="muted">Kome ide trebovanje. Kuvar klikne „Pošalji“ i otvori se WhatsApp poruka ovom broju; stavke se vide i u aplikaciji.</div>
        <label class="f">Osoba<select id="tm-user"><option value="">— izaberi —</option>${staff.map(p=>`<option value="${p.id}" ${p.id===siteFull.treb_user?'selected':''}>${esc(p.full_name)} (${ROLE[p.role]||p.role})</option>`).join('')}</select></label>
        <label class="f">WhatsApp broj<small>sa pozivnim brojem, npr. 381641234567</small><input id="tm-phone" inputmode="tel" value="${esc(siteFull.treb_phone||'')}" placeholder="381…"></label>
        <button class="btn" type="button" id="tm-save">Sačuvaj</button></section>
      <section class="card"><div class="h-md">${ico('thermo')} Mesta za temperaturu</div>
        <div>${S.points.map(p=>`<div class="reqrow" data-pt="${p.id}"><span class="n"><input data-f="label" value="${esc(p.label)}"><small>${KIND[p.kind]}</small></span><input class="num" data-f="t_min" value="${p.t_min??''}" placeholder="min" style="width:76px;font-size:16px"><input class="num" data-f="t_max" value="${p.t_max??''}" placeholder="max" style="width:76px;font-size:16px"><input type="checkbox" data-f="active" ${p.active?'checked':''} style="width:22px;height:22px"><button class="btn ghost sm" type="button" data-savept="1">Sačuvaj</button></div>`).join('')}</div>
        <div class="row"><input id="pt-label" placeholder="Novo mesto, npr. Frižider 3" style="flex:2"><select id="pt-kind" style="flex:1"><option value="frizider">frižider</option><option value="zamrzivac">zamrzivač</option><option value="holding">holding</option></select><button class="btn ghost" type="button" id="pt-add">${ico('plus')} Dodaj</button></div></section>
      </div>
      <section class="card"><div class="h-md">Stavke ček-lista</div><div class="muted">Rok i uključenost. Nove stavke i tekst: javi Vuksanu.</div>
        ${[1,2].map(sh=>`<div class="spread" style="margin-top:6px"><b>${SHIFT[sh].name}</b></div><div class="tablewrap"><table><tbody>${S.items.filter(i=>i.shift===sh).map(i=>`<tr data-it="${i.id}"><td class="muted">${esc(i.section)}</td><td style="white-space:normal">${esc(i.title)}</td><td><input type="time" data-f="due" value="${i.due?i.due.slice(0,5):''}" style="width:120px;padding:8px"></td><td><input type="checkbox" data-f="active" ${i.active?'checked':''} style="width:22px;height:22px"></td><td><button class="btn ghost sm" type="button" data-saveit="1">Sačuvaj</button></td></tr>`).join('')}</tbody></table></div>`).join('')}</section>`;
  }
  $('v-podes').addEventListener('click',async e=>{
    const b=e.target.closest('button'); if(!b) return;
    try{
      if(b.id==='qr-print-btn'){ $('qr-print').style.display='flex'; window.print(); setTimeout(()=>$('qr-print').style.display='none',500); return; }
      if(b.id==='qr-new'){ if(!(await ask('Nov QR kod?','Stari (odštampani) kod odmah prestaje da važi i mora da se odštampa nov.','Napravi nov',true))) return; await q(sb.rpc('staff_qr_new')); toast('Nov QR kod — odštampaj ga.','good'); return renderPodes(); }
      if(b.id==='st-here'){ const g=await getPos(true); if(g.lat==null) throw new Error('Lokacija nije dobijena.'); $('st-lat').value=g.lat.toFixed(7); $('st-lng').value=g.lng.toFixed(7); toast('Lokacija upisana (±'+Math.round(g.acc)+' m). Klikni Sačuvaj.'); return; }
      if(b.id==='st-save'){ const lat=num($('st-lat').value), lng=num($('st-lng').value), rad=Math.round(num($('st-rad').value)||0); if(lat==null||lng==null||rad<30) throw new Error('Upiši lokaciju i krug (najmanje 30 m).');
        await q(sb.from('staff_site').update({lat,lng,radius_m:rad,geo_required:$('st-geo').checked,qr_required:$('st-qr').checked,updated_at:new Date().toISOString()}).eq('id',1)); toast('Lokal sačuvan.','good'); return renderPodes(); }
      if(b.id==='tm-save'){ await q(sb.from('staff_site').update({treb_user:$('tm-user').value||null,treb_phone:$('tm-phone').value.replace(/[^\d]/g,'')||null}).eq('id',1)); toast('Menadžer za trebovanje sačuvan.','good'); return renderPodes(); }
      if(b.dataset.savept){ const r=b.closest('[data-pt]'), g=f=>r.querySelector(`[data-f="${f}"]`); await q(sb.from('chk_points').update({label:g('label').value.trim(),t_min:num(g('t_min').value),t_max:num(g('t_max').value),active:g('active').checked}).eq('id',r.dataset.pt)); toast('Sačuvano.','good'); return renderPodes(); }
      if(b.id==='pt-add'){ const label=$('pt-label').value.trim(); if(!label) throw new Error('Upiši naziv.'); const kind=$('pt-kind').value, def={frizider:[0,5],zamrzivac:[null,-18],holding:[63,null]}[kind];
        await q(sb.from('chk_points').insert({label,kind,t_min:def[0],t_max:def[1],sort:(S.points.length+1)*10})); toast('Dodato.','good'); return renderPodes(); }
      if(b.dataset.saveit){ const r=b.closest('[data-it]'); await q(sb.from('chk_items').update({due:r.querySelector('[data-f="due"]').value||null,active:r.querySelector('[data-f="active"]').checked}).eq('id',r.dataset.it)); toast('Sačuvano.','good'); return; }
    }catch(err){ toast(errText(err),'bad'); }
  });

  // ---------- meni ----------
  $('me-btn').addEventListener('click',()=>{ const m=$('menu'); m.hidden=!m.hidden; $('me-btn').setAttribute('aria-expanded',String(!m.hidden)); });
  document.addEventListener('click',e=>{ if(!e.target.closest('#menu')&&!e.target.closest('#me-btn')) $('menu').hidden=true; });
  $('logout').addEventListener('click',()=>{ $('menu').hidden=true; sb.auth.signOut(); });
  $('na-logout').addEventListener('click',()=>sb.auth.signOut());

  // ---------- uživo ----------
  let chan=null;
  function subscribe(){
    if(chan){ sb.removeChannel(chan); chan=null; }
    let t=null; const re=()=>{ clearTimeout(t); t=setTimeout(()=>{ if(S.view==='smena') reloadSmena(); else if(S.view==='treb') renderTreb(); else if(S.view==='kontrola') renderKontrola(); },600); };
    chan=sb.channel('osoblje-live');
    ['staff_shifts','staff_breaks','chk_done','chk_requests','chk_signoff'].forEach(tb=>chan.on('postgres_changes',{event:'*',schema:'public',table:tb},re));
    ['chk_items','chk_points'].forEach(tb=>chan.on('postgres_changes',{event:'*',schema:'public',table:tb},async()=>{ await loadBase(); re(); }));
    chan.subscribe();
  }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&S.uid&&S.view==='smena') reloadSmena(); });

  async function enter(session){
    if(chan){ sb.removeChannel(chan); chan=null; }
    if(!session){ document.body.className=''; showV('login-view'); return; }
    const {data:prof}=await sb.from('profiles').select('full_name,role').eq('id',session.user.id).maybeSingle();
    const role=(prof&&prof.role)||'ceka', name=(prof&&prof.full_name)||session.user.email;
    if(!['kuvar','sef','menadzer','admin'].includes(role)){
      $('na-title').textContent=role==='ceka'?'Nalog čeka odobrenje':'Nemaš pristup';
      $('na-text').textContent=role==='ceka'?'Administrator treba da odobri tvoj nalog u Kitchen Control-u (tab Tim).':'Ako ti treba pristup, javi se administratoru.';
      showV('noaccess-view'); return; }
    Object.assign(S,{open:null,breaks:[],done:[],reqs:[],signs:[],onShift:[],sec:null,expand:null,drafts:{},pending:{},kDate:null,kShift:null,kTab:null,treb:{name:'',qty:1,unit:'kom',urgent:false}});
    S.uid=session.user.id; S.role=role; S.name=name; S.admin=role==='admin'; S.sef=['sef','menadzer','admin'].includes(role);
    $('me-name').textContent=name; $('me-role').textContent=ROLE[role]||role; $('me-av').textContent=initials(name);
    showV('app-view');
    try{ await loadBase(); await loadReqs(); }catch(e){ toast('Greška: '+errText(e)+' — da li su pokrenuti SQL 21–23?','bad'); return; }
    const h=(location.hash||'').slice(1);
    await go(['smena','treb','vreme','kontrola','podes'].includes(h)?h:'smena');
    subscribe();
  }
  $('login-form').addEventListener('submit',async ev=>{ ev.preventDefault(); const m=$('l-msg'); m.textContent='';
    const email=$('l-email').value.trim(), password=$('l-pass').value; if(!email||!password){ m.textContent='Upiši email i lozinku.'; return; }
    $('l-btn').disabled=true; const {error}=await sb.auth.signInWithPassword({email,password}); $('l-btn').disabled=false; if(error) m.textContent='Pogrešan email ili lozinka.'; });
  let lastUid;
  sb.auth.onAuthStateChange((event,session)=>{ const uid=session?session.user.id:null; if(uid===lastUid&&event!=='INITIAL_SESSION') return; lastUid=uid; setTimeout(()=>enter(session),0); });
})();
</script>
</body>
</html>
